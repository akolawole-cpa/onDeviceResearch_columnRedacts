# Data Paths Configuration

# =============================================================================
# RUN IDENTIFIER
# =============================================================================
# Set this to your name/identifier to avoid conflicts when running simultaneously
# Example: "dan", "alex", "run_20250204"
# All output files will be namespaced with this identifier
run_id: "dan"

# =============================================================================
# Base paths (input - shared, read-only)
# =============================================================================
base_path: "/mnt/delta/"
bronze_path: "/mnt/delta/bronze/"
silver_path: "/mnt/delta/silver/"
gold_path: "/mnt/delta/gold/"
checkpoint_path: "/mnt/delta/checkpoints/"

# Project repository path for wonky studies
project_repository_path: "/mnt/project-repository-prod"

# Table names
tables:
  user: "user"
  task_complete: "task_complete"
  respondent_info: "respondent_info"
  task: "task"
  stripe_verification: "stripe_verification"

# =============================================================================
# Output file paths (namespaced by run_id)
# =============================================================================
# Use {run_id} placeholder - it will be replaced at runtime
# Example: with run_id="dan", user_info_df becomes:
#   "dbfs:/FileStore/misc/dan/user_info_df_pullcomplete.parquet"
output_files:
  user_info_df: "dbfs:/FileStore/misc/{run_id}/user_info_df_pullcomplete.parquet"
  user_info_df_post_eda: "dbfs:/FileStore/misc/{run_id}/user_info_df_post_eda.parquet"
  test_results_df: "dbfs:/FileStore/misc/{run_id}/testing_df.csv"
  feature_summary: "dbfs:/FileStore/misc/{run_id}/feature_summary.csv"
  interactions: "dbfs:/FileStore/misc/{run_id}/feature_interactions.csv"
  feature_summary_control: "dbfs:/FileStore/misc/{run_id}/feature_summary_control.csv"
  interactions_control: "dbfs:/FileStore/misc/{run_id}/feature_interactions_control.csv"
  feature_summary_exposed: "dbfs:/FileStore/misc/{run_id}/feature_summary_exposed.csv"
  interactions_exposed: "dbfs:/FileStore/misc/{run_id}/feature_interactions_exposed.csv"



# Data filters
filters:
  country: "GB"
  min_date: "2025-05-08"
  task_origin: "odr"